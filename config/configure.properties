##############################################
#              Basic Setup                  #
##############################################

baseURL=https://uat-next.zuperpro.com/login
#baseURL=https://web.zuperpro.com/login   
browser=chrome
company_Name=Reportbuildertest
#username=connectadmin@gmail.com
username=connectadmin@gmail.com
password=Test@123
#password

##############################################
#   Settings > User Management test data     #
##############################################
# A unique run suffix (yyMMddHHmmss) is appended to User ID, Last Name and Email at runtime.
# The new user's password is generated at runtime (not stored here).
newUser_IdPrefix=AUTO
newUser_FirstName=Auto
newUser_LastName=User
newUser_Designation=QA Automation
# Role Options: Field Executive, Team Leader, Admin
newUser_Role=Field Executive
newUser_EmailPrefix=auto.user.
newUser_EmailDomain=example.com

updatedUser_LastName=Updated
updatedUser_Designation=QA Lead

invalidUser_Email=invalid-email
invalidUser_Password=123

##############################################
#   Settings > Job Category test data        #
##############################################
# A unique run suffix (yyMMddHHmmss) is appended to the names at runtime.
# Category Name allows max 26 chars -> prefix + space + 12-char suffix must stay <= 26.
jobCategory_NamePrefix=Auto JC
jobCategory_UpdatedNamePrefix=Auto JC Upd
# Estimated Duration (Days is mandatory in the form)
jobCategory_Days=0
jobCategory_Hours=2
jobCategory_Minutes=30
jobCategory_UpdatedHours=3
jobCategory_UpdatedMinutes=15

##############################################
#   Settings > Job Card Template test data   #
##############################################
# A unique run suffix (yyMMddHHmmss) is appended to the names at runtime.
# The application allows duplicate template names, so the suffix keeps the automation template unique.
jobCardTemplate_NamePrefix=Auto JCT
jobCardTemplate_UpdatedNamePrefix=Auto JCT Upd
jobCardTemplate_Description=Automation job card template
jobCardTemplate_UpdatedDescription=Automation job card template updated
# Job Category must be an existing category (options: HVAC1, Intregration-Modules, Mobile Service, ...)
jobCardTemplate_JobCategory=Mobile Service
# Format options: A3, A4, A5, Legal, Letter, Tabloid | Orientation options: Portrait, Landscape
jobCardTemplate_Format=A4
jobCardTemplate_Orientation=Portrait
jobCardTemplate_UpdatedOrientation=Landscape
jobCardTemplate_Border=10mm
jobCardTemplate_Content=Automation job card template content

##############################################
#   Settings > Inspection Form test data     #
##############################################
# A unique run suffix (yyMMddHHmmss) is appended to the names at runtime.
inspectionForm_NamePrefix=Auto IF
inspectionForm_UpdatedNamePrefix=Auto IF Upd
inspectionForm_Description=Automation inspection form
inspectionForm_UpdatedDescription=Automation inspection form updated

##############################################
#   Settings > Job Notification test data    #
##############################################
# Automated notification type: Internal Notifications > Job Reminder
# A unique run suffix (yyMMddHHmmss) is appended to the names at runtime (duplicate names are allowed by the app).
jobNotification_NamePrefix=Auto JN
jobNotification_UpdatedNamePrefix=Auto JN Upd
# Remind Type options: Scheduled Start Time, Relative to Start Time, Relative to End Time, Relative to Due Date
jobNotification_RemindType=Relative to Start Time
jobNotification_RemindBefore=30
jobNotification_UpdatedRemindBefore=45
jobNotification_AlertTemplate=Automation reminder for job {job_title}
jobNotification_UpdatedAlertTemplate=Automation reminder updated for job {job_title}

##############################################
#   Settings > Gallery (Albums) test data    #
##############################################
# A unique run suffix (yyMMddHHmmss) is appended to the album names at runtime (duplicate names are rejected by the app).
gallery_AlbumNamePrefix=Auto Album
gallery_UpdatedAlbumNamePrefix=Auto Album Upd

##############################################
#   Settings > Custom Fields test data       #
#   (Project / Job / Quote / Invoice)        #
##############################################
# A unique run suffix (yyMMddHHmmss) is appended at runtime; every module uses its own name.
# The field is added to the 'Default field groups' group of each module and deleted by the test.
customField_FieldType=Single Line Text
customField_Project_NamePrefix=Automation Project Custom Field
customField_Job_NamePrefix=Automation Job Custom Field
customField_Quote_NamePrefix=Automation Quote Custom Field
customField_Invoice_NamePrefix=Automation Invoice Custom Field
customField_UpdatedNameWord=Updated
customField_Description=Automation custom field description
customField_UpdatedDescription=Automation custom field description updated

# ---- Slack final report (TestUtility.ReportToSlack) ----
# Bot token: environment variable SLACK_BOT_TOKEN overrides this value (never logged)
slack_enabled=true
slack_bot_token=
slack_channel_id=C0AK06LKHBL
# optional: reply inside an existing Slack thread (message ts), leave empty to post to the channel
slack_thread_ts=
